events {
    worker_connections 1024;
}

http {
    # Look the backend up through Docker's DNS at request time (cached 10 s),
    # not once at start: recreating the backend container can change its IP,
    # and a start-time lookup kept proxying to the old one (502 on every API,
    # 2026-11-07). A variable in proxy_pass is what makes nginx use the
    # resolver; with no URI part it passes the request URI unchanged, as before.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $host $backend_upstream {
        default http://backend:8000;
    }

    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.applaut.lvamo.com;

        ssl_certificate     /etc/letsencrypt/live/api.applaut.lvamo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.applaut.lvamo.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 20M;

        location / {
            proxy_pass         $backend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # LVAMO platform hostname — for LVAMO-wide endpoints that belong to no
    # vertical (/api/v1/platform/*, e.g. hub settings). Same shared backend;
    # see CLAUDE.md's structure rule.
    server {
        listen 443 ssl;
        server_name api.lvamo.com;

        ssl_certificate     /etc/letsencrypt/live/api.lvamo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.lvamo.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 20M;

        location / {
            proxy_pass         $backend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # Jobref gets its own hostname (not "applaut") even though it proxies to
    # the same shared backend process/container as the block above — see
    # PROGRESS.md's Multi-Vertical Architecture section. Routing within the
    # backend still happens by path (/api/v1/jobref/*), this just gives it a
    # correctly-named front door instead of sitting under api.applaut.*.
    server {
        listen 443 ssl;
        server_name api.jobref.lvamo.com;

        ssl_certificate     /etc/letsencrypt/live/api.jobref.lvamo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.jobref.lvamo.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 20M;

        location / {
            proxy_pass         $backend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # ProSho's own hostname — same shared backend; routing still happens by
    # path (/api/v1/prosho/*). See CLAUDE.md's structure rule.
    server {
        listen 443 ssl;
        server_name api.prosho.lvamo.com;

        ssl_certificate     /etc/letsencrypt/live/api.prosho.lvamo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.prosho.lvamo.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 20M;

        location / {
            proxy_pass         $backend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
