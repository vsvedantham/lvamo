# Pinned so the Compose project (and so the container, network and
# `<project>_postgres_data` volume names) doesn't depend on the folder name.
# Without this, renaming or re-cloning into a differently-named folder starts
# Postgres on a new, empty volume and the existing data looks "lost".
name: lvamo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lvamo
      POSTGRES_USER: lvamo
      POSTGRES_PASSWORD: applaut_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lvamo"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # Override DATABASE_URL to use the compose service name, not localhost
      DATABASE_URL: postgresql+asyncpg://lvamo:applaut_dev@postgres:5432/lvamo
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
