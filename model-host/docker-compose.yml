# Applaut AI model host: one llama.cpp server per task, nothing else.
# Every model host is identical: the scorer on :8080, the writer on :8081,
# models pinned by backend/app/applaut/ai/models.lock (update.sh writes the
# SCORER_* / WRITER_* lines of .env from it). The app VM's ai-worker sends a
# host one request at a time, so the two servers never compete for the cores.
# See README.md.
name: lvamo-model

x-llama: &llama
  # Pinned by digest: the version Phase 0 was measured with (2026-10-31).
  image: ghcr.io/ggml-org/llama.cpp@sha256:d9e9e74ba3f7ef119b1939162b1631f99b75ec703c310d140cfa2fdac8907389
  restart: always
  cpuset: "${LLAMA_CPUS:-0-3}"
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"
  volumes:
    - ./models:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 30s
    timeout: 5s
    retries: 3

# Both servers: --parallel 1 (one request at a time; the app's queue is the
# order) and --cache-ram 0 (the default 8 GB prompt cache got the server
# OOM-killed at its memory limit in Phase 0).
services:
  scorer:
    <<: *llama
    mem_limit: 8g
    ports:
      - "${WG_ADDRESS:?set WG_ADDRESS in .env}:8080:8080"
    command: >-
      --model /models/${SCORER_FILE:?run update.sh} --alias ${SCORER_ALIAS:?run update.sh}
      --api-key ${LLAMA_API_KEY:?set LLAMA_API_KEY in .env}
      --threads ${LLAMA_THREADS:-4} --threads-batch ${LLAMA_THREADS:-4}
      --parallel 1 --ctx-size 8192 --cache-ram 0 --jinja --host 0.0.0.0 --port 8080

  writer:
    <<: *llama
    mem_limit: 12g
    ports:
      - "${WG_ADDRESS:?set WG_ADDRESS in .env}:8081:8080"
    command: >-
      --model /models/${WRITER_FILE:?run update.sh} --alias ${WRITER_ALIAS:?run update.sh}
      --api-key ${LLAMA_API_KEY:?set LLAMA_API_KEY in .env}
      --threads ${LLAMA_THREADS:-4} --threads-batch ${LLAMA_THREADS:-4}
      --parallel 1 --ctx-size 8192 --cache-ram 0 --jinja --host 0.0.0.0 --port 8080
