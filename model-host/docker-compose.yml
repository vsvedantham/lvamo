# Applaut AI model host: llama.cpp's OpenAI-compatible server and nothing else.
# Runs on its own VM (Ampere A1, 4 OCPU / 24 GB). The app VM's ai-worker is
# its only client, over WireGuard; see README.md.
name: lvamo-model

services:
  llm:
    # Pinned by digest: the version Phase 0 was measured with (2026-10-31).
    image: ghcr.io/ggml-org/llama.cpp@sha256:d9e9e74ba3f7ef119b1939162b1631f99b75ec703c310d140cfa2fdac8907389
    restart: always
    cpuset: "${LLAMA_CPUS:-1-3}"
    mem_limit: 8g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ./models:/models:ro
    # Only on the WireGuard address: never reachable from the internet.
    ports:
      - "${WG_ADDRESS:-10.8.0.2}:8080:8080"
    command:
      - --model
      - /models/${LLAMA_MODEL_FILE:-Qwen3.5-9B-Q4_0.gguf}
      - --alias
      - ${LLAMA_ALIAS:-qwen3.5-9b-q4_0}
      - --api-key
      - ${LLAMA_API_KEY:?set LLAMA_API_KEY in .env}
      - --threads
      - "${LLAMA_THREADS:-3}"
      - --threads-batch
      - "${LLAMA_THREADS:-3}"
      # One request at a time: the ai-worker's queue is the order.
      - --parallel
      - "1"
      - --ctx-size
      - "8192"
      # The default 8 GB prompt cache got the server OOM-killed at mem_limit in Phase 0.
      - --cache-ram
      - "0"
      - --jinja
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
