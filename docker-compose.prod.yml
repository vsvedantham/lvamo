# Pinned so the Compose project (and so the container, network and
# `<project>_postgres_data` volume names) doesn't depend on the folder name.
# Without this, renaming or re-cloning into a differently-named folder starts
# Postgres on a new, empty volume and the existing data looks "lost".
name: lvamo

# Container logs rotate by size. nginx logs every request with the client's
# IP; at ~3.5 MB/day (Oct 2026) 5 x 20 MB is about 30 days, which is what the
# ProSho privacy notice promises. More traffic means fewer days, never more.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    logging: *logging
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  # Applaut AI: the one process that feeds the model, one job at a time in
  # queue order (backend/app/applaut/ai/worker.py). The model itself runs on
  # the model host (model-host/), reached through APPLAUT_LLM_BASE_URL.
  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    logging: *logging
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: python -m app.applaut.ai.worker
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: always
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend

volumes:
  postgres_data:
